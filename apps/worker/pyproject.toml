[project]
name = "sokoodds-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "celery",
  "redis",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg[binary]",
  "greenlet",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
